# Rust: расширенный пример без привязки к фреймворку.
# Пути, FQN и пороги адаптируйте под проект; слои названы по гексагональной
# схеме, профили axum.yaml и workspace.yaml лежат рядом.
config_version: 1
languages:
  enabled: [rust]
  # Расширение rs встроено; languages.extensions нужен только для
  # нестандартных расширений, например {rsx: rust}.
paths:
  include: ["**"] # Все поддерживаемые файлы выбранного языка, включая корневые.
  exclude:
    # Интеграционные тесты, бенчмарки и примеры Cargo не описывают структуру
    # крейта. Модульные тесты в #[cfg(test)] mod tests остаются внутри
    # исходников и попадают в метрики: используйте analyzer-ignore или baseline.
    - "tests/**"
    - "benches/**"
    - "examples/**"
    - "**/fixtures/**"
    # Сгенерированный код (prost, tonic, bindgen) и сборочные артефакты.
    - "**/generated/**"
    - "target/**"
    - "build.rs"
vendor:
  paths: ["vendor/**", "node_modules/**"]
  mode: collapsed
  parse: lazy # none запрещает раскрытие зависимостей; full разбирает сразу.
limits:
  file_lines: {warn: 400, error: 800}
  function_lines: {warn: 40, error: 100}
  functions_per_file: {warn: 20, error: 40}
  methods_per_class: {warn: 15, error: 30}
  fields_per_class: {warn: 10, error: 20}
  function_params: {warn: 4, error: 7}
  cyclomatic_complexity: {warn: 10, error: 20}
  cognitive_complexity: {warn: 15, error: 30}
  nesting_depth: {warn: 4, error: 6}
  return_points: {warn: 4, error: 8} # Оператор ? точкой возврата не считается.
  # Несколько типов в модуле — норма Rust; в счёт идут и объявления mod,
  # и блоки impl, поэтому порог свободный.
  types_per_file: {warn: 15, error: 30}
  # LCOM4 > 1 означает несколько независимых групп методов; считается и для
  # типа, и для файла со свободными функциями. Обработчики и утилитные модули
  # дают высокие значения по замыслу: см. by_path.
  lcom4: {warn: 3, error: 8}
  fan_in: {warn: 20, error: 40}
  fan_out: {warn: 10, error: 20}
  halstead_volume: {warn: 1000, error: 2000}
  duplicate_functions: {warn: 0, error: 5}
  # Единственный способ сделать цикл между модулями блокирующим в CI:
  # архитектурные находки arch_cycle и arch_boundary код выхода не меняют.
  module_cycle: {error: 0}
  # Все числовые пороги — верхние границы. comment_ratio и
  # maintainability_index не задают минимальную долю/минимальный индекс.
  # inheritance_depth для Rust не задан: реализация трейтов не наследование.
  # by_language нужен только при нескольких языках в languages.enabled:
  # для единственного языка он молча перекрывает общий порог выше.
  by_path:
    - glob: "src/presentation/**" # Обработчики и команды: функции независимы по замыслу.
      lcom4: {warn: 10, error: 20}
      function_params: {warn: 6, error: 10}
    - glob: "src/legacy/**" # Замените на каталог существующего долга.
      function_lines: {warn: 80, error: 160}
      cyclomatic_complexity: {warn: 15, error: 30}
  by_entity:
    # Точный FQN из отчёта metrics. Движок строит его из пути файла:
    # src::module::file::Type::method, для mod.rs — src::module::mod::function.
    'src::application::worker::Worker::run':
      function_params: {warn: 6, error: 10}
  aggregates:
    "cyclomatic_complexity.p95": {warn: 12, error: 25}
    "function_lines.avg": {warn: 30, error: 60}
# Иллюстративные каталоги слоёв: замените под структуру своего проекта.
# Вместо dir: подходит селектор по модулю в том же виде, что и FQN: mod:src::domain.
sets:
  domain: ["dir:src/domain"]
  application: ["dir:src/application"]
  infrastructure: ["dir:src/infrastructure"]
  presentation: ["dir:src/presentation"]
  core: ["set:domain", "set:application", "!glob:**/generated/**"]
external:
  capture_args: literal
  max_arg_length: 160
  redact: ['(?i)(token|password|secret|api[_-]?key)=[^&\s]+']
  rules:
    # Встроенный каталог знает sqlx::query, diesel execute, lapin basic_publish,
    # reqwest get, std::process::Command и TcpStream::connect. Для своей
    # библиотеки укажите путь вызова crate::Type::method; glob допустим,
    # вызов через типизированную локальную переменную тоже распознаётся.
    - category: http
      pattern: 'reqwest::Client::post'
      library: reqwest
      operation: post
metrics:
  count_implicit_receiver: false # self и &self параметрами не считаются.
  count_private_methods: true # Учитывается видимость pub/pub(crate).
  count_accessors: true # Методы вида field()/set_field считаются методами типа.
  count_nested_functions: true # Замыкания и вложенные fn считаются в functions_per_file.
  histogram_bins: 10
graph:
  max_implementations: 50
resolution:
  rust:
    # null — неизвестный вход. Настройте под анализируемый Cargo-проект:
    # target: x86_64-unknown-linux-gnu, features: [default], cfg: []
    target: null
    features: null
    cfg: null
algorithmic_complexity:
  enabled: true
  heuristics: true
  unknown: info # Стоимость вызовов через трейты и generics часто неизвестна.
  # Линейный проход по коллекции — норма, порог от N^2.
  limits: {warn: "N^2", error: "N^3"}
  by_path:
    - glob: "src/legacy/**"
      limits: {warn: "N^3"}
  by_entity:
    'src::application::worker::Worker::run':
      unknown: warn
architecture:
  enabled: true
  profile: extended # strict — только циклы, явные границы и структурные копии.
  disabled_rules: []
  # Список заменяет default движка целиком; добавлены соглашения Cargo.
  exclude:
    - "tests/**"
    - "benches/**"
    - "examples/**"
    - "**/fixtures/**"
    - "**/generated/**"
    - "build.rs"
  rules:
    arch_cycle: {}
    arch_boundary: {}
    arch_dry: {min_tokens: 100, min_statements: 5}
    arch_srp: {min_methods: 8, min_group_methods: 3}
    arch_ocp: {min_sites: 3, min_alternatives: 3}
    arch_factory: {min_sites: 2, min_alternatives: 3}
    arch_lsp: {}
    arch_isp: {min_methods: 8, max_usage_ratio: 0.25}
    arch_demeter: {}
    arch_stability: {instability_delta: 0.3}
  # Слои гексагональной архитектуры: зависимости направлены внутрь, к domain.
  layers:
    - name: domain
      selectors: ["dir:src/domain"]
    - name: application
      selectors: ["dir:src/application"]
    - name: infrastructure
      selectors: ["dir:src/infrastructure"]
    - name: presentation
      selectors: ["dir:src/presentation"]
  forbidden_dependencies:
    - {from: domain, to: application, principle: DIP}
    - {from: domain, to: infrastructure, principle: DIP}
    - {from: domain, to: presentation, principle: DIP}
    - {from: application, to: infrastructure, principle: DIP}
    - {from: application, to: presentation, principle: DIP}
    - {from: infrastructure, to: presentation, principle: DIP}
  # Файлы сборки приложения (src/main.rs, src/lib.rs) исключаются из проверки
  # границ, только если их накрывает селектор слоя; вне слоёв зависимость
  # и так не проверяется. Значения для сервиса и workspace смотрите в их профилях.
  composition_roots: []
  max_evidence: 50
cache:
  enabled: true
  path: .analyzer-cache
output:
  formats: [console] # Для машинного stdout замените на [json].
